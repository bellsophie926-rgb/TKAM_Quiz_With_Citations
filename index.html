<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKAM Semester 2 Final - 55 Question Mega Quiz</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 30px; background-color: #2c3e50; color: white; padding: 30px; border-radius: 10px; }
        .header h1 { margin: 0; font-size: 2.2em; }
        .header p { margin: 5px 0 0; color: #bdc3c7; }
        #quiz-container { max-width: 900px; margin: 0 auto; }
        .question-card { background: white; border-radius: 8px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #3498db; }
        .question-text { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; color: #2c3e50; }
        .option { display: block; background: #ecf0f1; padding: 12px 15px; margin-bottom: 10px; border-radius: 5px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .option:hover { background: #dcdde1; }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .disabled { pointer-events: none; opacity: 0.8; }
        .explanation { display: none; margin-top: 15px; padding: 15px; background: #e8f4f8; border-left: 4px solid #17a2b8; border-radius: 0 4px 4px 0; color: #0c5460; font-weight: 500; line-height: 1.5; }
        .reference { display: inline-block; margin-top: 10px; background: #ffeaa7; color: #d35400; padding: 5px 10px; border-radius: 4px; font-size: 0.9em; font-weight: bold; border: 1px solid #f39c12; }
        .score-board { text-align: center; font-size: 1.5em; font-weight: bold; margin-bottom: 20px; color: #2980b9; position: sticky; top: 0; background: rgba(244, 247, 246, 0.95); padding: 10px; z-index: 100; }
    </style>
</head>
<body>

<div id="quiz-container">
    <div class="header">
        <h1>📚 TKAM 55-Question Mega Quiz</h1>
        <p>Interactive Practice with Study Guide Citations</p>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 55</div>
    <div id="questions"></div>
</div>

<script>
    const questions = [{"q": "1. What is the narrative point of view used in To Kill a Mockingbird?", "options": ["First-person, narrated by an older Scout Finch", "Third-person omniscient, focusing on Atticus", "First-person, narrated by Jem Finch", "Third-person limited, following Boo Radley"], "ans": 0, "exp": "The story is told by an older Scout looking back, allowing readers to see the adult world through innocent eyes.", "ref": "\u51fa\u5904\uff1a1. TKAM Book Info & Plot Elements -> Point of View"}, {"q": "2. In what specific setting (time and place) does the story occur?", "options": ["Montgomery, Alabama during the Civil War", "Maycomb, Alabama during the Great Depression", "Atlanta, Georgia during the 1950s Civil Rights Movement", "Scottsboro, Alabama during the Roaring Twenties"], "ans": 1, "exp": "The novel is set in the fictional town of Maycomb, Alabama, during the 1930s Great Depression.", "ref": "\u51fa\u5904\uff1a1. TKAM Book Info & Plot Elements -> Setting"}, {"q": "3. Which conflict represents the 'Man vs. Society' struggle in the novel?", "options": ["Scout fighting Walter Cunningham", "Atticus fighting the entrenched racism and prejudice of Maycomb", "Jem struggling to understand Boo Radley", "Bob Ewell physically attacking the children"], "ans": 1, "exp": "Atticus standing up against the town's racism to defend Tom Robinson represents Man vs. Society.", "ref": "\u51fa\u5904\uff1a1. TKAM Book Info & Plot Elements -> Conflicts"}, {"q": "4. Which conflict represents the 'Man vs. Man' struggle?", "options": ["Atticus defending Tom in court", "Bob Ewell attacking Scout and Jem in the woods", "Jem destroying Mrs. Dubose's flowers", "Miss Caroline scolding Scout"], "ans": 1, "exp": "Bob Ewell's direct physical attack on the children is a classic Man vs. Man conflict.", "ref": "\u51fa\u5904\uff1a1. TKAM Book Info & Plot Elements -> Conflicts"}, {"q": "5. Which internal struggle represents the 'Man vs. Self' conflict?", "options": ["Scout deciding what to wear to church", "Atticus deciding whether to shoot the rabid dog", "Jem struggling to reconcile his belief in justice with the jury's cruel, prejudiced verdict", "Dill deciding to run away from home"], "ans": 2, "exp": "Jem's painful loss of innocence and internal crisis over the unfair verdict is a Man vs. Self conflict.", "ref": "\u51fa\u5904\uff1a1. TKAM Book Info & Plot Elements -> Conflicts"}, {"q": "6. What event represents the primary climax of the novel?", "options": ["Scout finding gifts in the knothole", "Atticus shooting the mad dog", "The jury delivering a guilty verdict for Tom Robinson despite evidence of his innocence", "Boo Radley rescuing the children"], "ans": 2, "exp": "The guilty verdict is the emotional peak that shatters the children's worldview.", "ref": "\u51fa\u5904\uff1a1. TKAM Book Info & Plot Elements -> Climax & Resolution"}, {"q": "7. What is the resolution of the novel?", "options": ["Tom Robinson is freed on appeal", "Atticus is elected as mayor", "Heck Tate covers up Boo Radley's actions, and Scout finally understands empathy by standing on Boo's porch", "Bob Ewell goes to jail"], "ans": 2, "exp": "The resolution involves protecting Boo (the mockingbird) and Scout mastering empathy.", "ref": "\u51fa\u5904\uff1a1. TKAM Book Info & Plot Elements -> Climax & Resolution"}, {"q": "8. How is Boo Radley primarily characterized?", "options": ["A violent criminal", "A misunderstood outcast who acts as a secret protector and 'mockingbird'", "A wealthy aristocrat", "A strict school teacher"], "ans": 1, "exp": "Boo is feared by the town but is actually a gentle soul who saves the children.", "ref": "\u51fa\u5904\uff1a2. Characters -> The Radleys"}, {"q": "9. What does Atticus Finch primarily represent?", "options": ["The moral compass of Maycomb who teaches empathy and real courage", "The corrupt legal system of the South", "The adherence to strict class traditions", "The wealth of the upper class"], "ans": 0, "exp": "Atticus represents integrity, reason, and moral strength.", "ref": "\u51fa\u5904\uff1a2. Characters -> The Finches"}, {"q": "10. What role does Scout play?", "options": ["The strict disciplinarian", "The innocent, tomboyish narrator who learns about the harsh realities of life", "The town gossip", "The tragic victim"], "ans": 1, "exp": "Scout is the young narrator experiencing a Bildungsroman (coming-of-age).", "ref": "\u51fa\u5904\uff1a2. Characters -> The Finches"}, {"q": "11. How does the trial affect Jem Finch?", "options": ["He decides to become a racist like the town", "He ignores it completely", "His idealistic worldview is shattered, causing a painful loss of childhood innocence", "He decides to run away"], "ans": 2, "exp": "Jem is deeply traumatized by the injustice of the guilty verdict.", "ref": "\u51fa\u5904\uff1a2. Characters -> The Finches"}, {"q": "12. What does the Ewell family represent?", "options": ["Hardworking farmers", "The poorest, uneducated, and most racist 'white trash' in Maycomb", "Wealthy aristocrats", "Progressive civil rights activists"], "ans": 1, "exp": "The Ewells represent the lowest rung of white society, driven by ignorance and hate.", "ref": "\u51fa\u5904\uff1a2. Characters -> The Ewells vs. The Cunninghams"}, {"q": "13. How do the Cunninghams differ from the Ewells?", "options": ["They live in town", "They are highly educated", "Though equally poor, they are proud, polite, and honorable, never taking what they cannot repay", "They own slaves"], "ans": 2, "exp": "Harper Lee contrasts them to show that moral character matters more than social class.", "ref": "\u51fa\u5904\uff1a2. Characters -> The Ewells vs. The Cunninghams"}, {"q": "14. What is Calpurnia's role in the Finch household?", "options": ["A distant employee", "A strict mother figure who bridges the gap between the white and Black communities", "Scout's secret tutor", "Aunt Alexandra's best friend"], "ans": 1, "exp": "Calpurnia raises the children and takes them to her Black church, broadening their perspective.", "ref": "\u51fa\u5904\uff1a2. Characters -> Other Key Figures"}, {"q": "15. What does Dill Harris represent?", "options": ["Childhood innocence and imagination, as seen when he cries at the trial's injustice", "The harsh reality of the legal system", "The prejudiced townspeople", "Physical courage"], "ans": 0, "exp": "Dill represents pure childhood innocence, physically sickened by the adults' cruelty.", "ref": "\u51fa\u5904\uff1a2. Characters -> Other Key Figures"}, {"q": "16. How is Miss Maudie Atkinson characterized?", "options": ["A mean gossip", "A racist neighbor", "An open-minded neighbor who shares Atticus's moral values and mentors the kids", "A strict teacher"], "ans": 2, "exp": "Miss Maudie acts as a progressive, reasonable female mentor for the children.", "ref": "\u51fa\u5904\uff1a2. Characters -> Other Key Figures"}, {"q": "17. Why does Atticus call Mrs. Dubose the 'bravest person'?", "options": ["She fought Bob Ewell", "She publicly defended Tom", "She fought a painful battle to overcome her morphine addiction before dying", "She saved the children from a fire"], "ans": 2, "exp": "Atticus respects her courage in fighting a losing battle to die free of addiction.", "ref": "\u51fa\u5904\uff1a2. Characters -> Other Key Figures"}, {"q": "18. What does Miss Gates's lesson on Hitler reveal about her?", "options": ["She is empathetic", "She is a hypocrite who condemns prejudice abroad but supports local racism", "She supports Bob Ewell", "She is ignorant of history"], "ans": 1, "exp": "She is a prime example of the town's ironic hypocrisy.", "ref": "\u51fa\u5904\uff1a2. Characters -> Other Key Figures"}, {"q": "19. What is Tom Robinson's primary role in the theme of the novel?", "options": ["The ultimate 'mockingbird'\u2014an innocent man destroyed by society's prejudice", "A violent rebel", "A mentor for Jem", "A wealthy antagonist"], "ans": 0, "exp": "Tom is innocent, hardworking, and destroyed by evil, exactly like a mockingbird.", "ref": "\u51fa\u5904\uff1a2. Characters -> Other Key Figures"}, {"q": "20. Why did Judge Taylor assign Atticus to Tom's case?", "options": ["To punish Atticus", "Because he knew Atticus was the only lawyer who would actually try to give Tom a fair chance", "Because Tom requested Atticus", "Because Atticus needed the money"], "ans": 1, "exp": "Judge Taylor subtly tries to fight the town's racism by appointing the best man for the job.", "ref": "\u51fa\u5904\uff1a2. Characters -> Other Key Figures"}, {"q": "21. Who is Miss Stephanie Crawford?", "options": ["The town doctor", "The town gossip who spreads rumors about Boo Radley", "The school principal", "The newspaper editor"], "ans": 1, "exp": "She is the primary source of the exaggerated rumors the children hear.", "ref": "\u51fa\u5904\uff1a2. Characters -> Townspeople"}, {"q": "22. Why does Mr. Dolphus Raymond pretend to be drunk?", "options": ["He loves alcohol", "He needs an excuse to give the prejudiced townspeople a reason for his choice to live with Black people", "He wants to scare the children", "He is hiding from the police"], "ans": 1, "exp": "He fakes being a drunk to make his progressive lifestyle easier for the prejudiced town to digest.", "ref": "\u51fa\u5904\uff1a2. Characters -> Townspeople"}, {"q": "23. What role does Heck Tate play at the end of the novel?", "options": ["He arrests Boo Radley", "He arrests Atticus", "He decides to cover up Boo Radley's actions to protect him from unwanted public attention", "He becomes the new judge"], "ans": 2, "exp": "Heck Tate insists Bob Ewell 'fell on his knife' to spare Boo the agony of a public trial.", "ref": "\u51fa\u5904\uff1a2. Characters -> Townspeople"}, {"q": "24. Who is Mr. Avery?", "options": ["The mayor", "A grumpy, superstitious neighbor who blames the children for bad weather", "Tom's employer", "The prosecuting attorney"], "ans": 1, "exp": "He is an overweight, grumpy neighbor whom the children build a mud snowman to mock.", "ref": "\u51fa\u5904\uff1a2. Characters -> Townspeople"}, {"q": "25. What does the mockingbird symbolize?", "options": ["The Southern economy", "Innocent beings who only do good but are destroyed by society's evil", "The harsh Jim Crow laws", "Atticus's legal skills"], "ans": 1, "exp": "Mockingbirds just sing for people; killing one is a sin, symbolizing the destruction of innocence.", "ref": "\u51fa\u5904\uff1a3. Literary Devices -> Symbolism & Theme"}, {"q": "26. What is the difference between a 'Topic' and a 'Theme Statement'?", "options": ["They are identical", "A topic is a sentence, a theme is a word", "A topic is 1-2 words, while a theme statement must be a complete sentence explaining a universal truth", "Themes are only for non-fiction"], "ans": 2, "exp": "A topic is 'prejudice'. A theme statement is 'Prejudice destroys innocent lives.'", "ref": "\u51fa\u5904\uff1a6. Writing Composition -> Multi-Paragraph Essay Components"}, {"q": "27. Which theme is most central to Atticus's teachings?", "options": ["Financial success", "Empathy and understanding others", "Strict adherence to the law at all costs", "Revenge"], "ans": 1, "exp": "Atticus constantly teaches Scout to climb into other people's skin.", "ref": "\u51fa\u5904\uff1a3. Literary Devices -> Symbolism & Theme"}, {"q": "28. 'Aunt Alexandra was standing stiff as a stork.' What literary device is used here?", "options": ["Metaphor", "Personification", "Simile", "Hyperbole"], "ans": 2, "exp": "A simile compares two things using 'like' or 'as'.", "ref": "\u51fa\u5904\uff1a3. Literary Devices -> Figurative Language"}, {"q": "29. 'Calpurnia, in her navy voile dress and tub of a hat...' What literary device is 'tub of a hat'?", "options": ["Metaphor", "Simile", "Personification", "Allusion"], "ans": 0, "exp": "A metaphor directly compares the hat to a tub without using 'like' or 'as'.", "ref": "\u51fa\u5904\uff1a3. Literary Devices -> Figurative Language"}, {"q": "30. '...its courthouse proud, its streets graciously wide.' What device is this?", "options": ["Simile", "Hyperbole", "Personification", "Flashback"], "ans": 2, "exp": "Giving human feelings (proud, gracious) to inanimate objects (courthouse, streets) is personification.", "ref": "\u51fa\u5904\uff1a3. Literary Devices -> Figurative Language"}, {"q": "31. 'Aunt Alexandra sat there exactly as if she had sat there every day of her life.' What device is used to emphasize her dominance?", "options": ["Hyperbole", "Metaphor", "Personification", "Allusion"], "ans": 0, "exp": "Hyperbole is an extreme exaggeration used for emphasis.", "ref": "\u51fa\u5904\uff1a3. Literary Devices -> Figurative Language"}, {"q": "32. When the novel refers to 'The Great Depression', which literary device is used?", "options": ["Irony", "Allusion", "Foreshadowing", "Flashback"], "ans": 1, "exp": "An allusion is a direct reference to a real historical event, person, or piece of literature.", "ref": "\u51fa\u5904\uff1a3. Literary Devices -> Allusions, Flashback, Irony, Foreshadowing"}, {"q": "33. The entire novel is an older Scout recalling the events leading up to Jem's broken arm. What structural device is this?", "options": ["Foreshadowing", "Flashback", "Hyperbole", "Irony"], "ans": 1, "exp": "The novel's framework is a flashback to her childhood.", "ref": "\u51fa\u5904\uff1a3. Literary Devices -> Allusions, Flashback, Irony, Foreshadowing"}, {"q": "34. Miss Caroline offering Walter Cunningham a quarter, unaware he can't pay it back, is an example of:", "options": ["Foreshadowing", "Metaphor", "Irony", "Allusion"], "ans": 2, "exp": "This is dramatic/situational irony, where reality and expectations clash awkwardly.", "ref": "\u51fa\u5904\uff1a3. Literary Devices -> Allusions, Flashback, Irony, Foreshadowing"}, {"q": "35. Bob Ewell spitting in Atticus's face and threatening him is an example of:", "options": ["Foreshadowing", "Flashback", "Personification", "Symbolism"], "ans": 0, "exp": "Foreshadowing hints at future events; this hints at Bob's final attack.", "ref": "\u51fa\u5904\uff1a3. Literary Devices -> Allusions, Flashback, Irony, Foreshadowing"}, {"q": "36. The novel is sometimes criticized for focusing on a white man saving Black people rather than Black agency. What is this concept called?", "options": ["The White Savior Narrative", "The Great Depression", "Bildungsroman", "Social commentary"], "ans": 0, "exp": "The White Savior Narrative is controversial as it can reinforce harmful stereotypes.", "ref": "\u51fa\u5904\uff1a3. Literary Devices -> Social Commentary & The White Savior Narrative"}, {"q": "37. 'You never really understand a person... until you climb into his skin and walk around in it.' Who said this?", "options": ["Miss Maudie", "Atticus Finch", "Calpurnia", "Judge Taylor"], "ans": 1, "exp": "Atticus says this to teach Scout about empathy.", "ref": "\u51fa\u5904\uff1a4. Quotes & Analysis -> Exam Requirement for Quotes"}, {"q": "38. What is the importance of the quote: 'climb into his skin and walk around in it'?", "options": ["It explains why Bob attacked the kids", "It establishes the central theme of empathy", "It proves Tom is innocent", "It reveals Boo's identity"], "ans": 1, "exp": "This quote is the moral backbone of the entire novel.", "ref": "\u51fa\u5904\uff1a4. Quotes & Analysis -> Exam Requirement for Quotes"}, {"q": "39. In the STEAL method of Indirect Characterization, what does the 'E' stand for?", "options": ["Emotions", "Environment", "Effect on others", "Education"], "ans": 2, "exp": "STEAL stands for Speech, Thoughts, Effect on others, Actions, Looks.", "ref": "\u51fa\u5904\uff1a4. Quotes & Analysis -> Exam Requirement for Quotes"}, {"q": "40. 'He was the filthiest human I had ever seen.' Which part of the STEAL method is used here to characterize Burris Ewell?", "options": ["Speech", "Actions", "Looks", "Thoughts"], "ans": 2, "exp": "Describing his filthy appearance (Looks) indirectly reveals his neglected background.", "ref": "\u51fa\u5904\uff1a4. Quotes & Analysis -> Exam Requirement for Quotes"}, {"q": "41. What is 'Direct Characterization'?", "options": ["When the author explicitly tells you what a character is like", "When you have to guess a character's traits through their actions", "When characters talk directly to each other", "When a character writes a letter"], "ans": 0, "exp": "Direct characterization leaves no guessing (e.g., 'He was a brave man').", "ref": "\u51fa\u5904\uff1a2. Characters (General Concept)"}, {"q": "42. Which word represents the 'Positive' degree of comparison?", "options": ["Faster", "Fast", "Fastest", "More fast"], "ans": 1, "exp": "The positive degree is the base form of the adjective.", "ref": "\u51fa\u5904\uff1a5. Grammar & Mechanics -> Degrees of Comparison"}, {"q": "43. Which word represents the 'Comparative' degree of comparison?", "options": ["Good", "Best", "Better", "Most good"], "ans": 2, "exp": "The comparative degree is used to compare two things (e.g., better, faster).", "ref": "\u51fa\u5904\uff1a5. Grammar & Mechanics -> Degrees of Comparison"}, {"q": "44. Which word represents the 'Superlative' degree of comparison?", "options": ["Smart", "Smarter", "Smartest", "More smart"], "ans": 2, "exp": "The superlative compares three or more things, expressing the highest degree.", "ref": "\u51fa\u5904\uff1a5. Grammar & Mechanics -> Degrees of Comparison"}, {"q": "45. What punctuation mark must be used at the end of an interrogative sentence?", "options": ["A period (.)", "A comma (,)", "A question mark (?)", "An exclamation point (!)"], "ans": 2, "exp": "Interrogative sentences ask questions and require a question mark.", "ref": "\u51fa\u5904\uff1a5. Grammar & Mechanics -> Punctuation"}, {"q": "46. Which of the following grammar rules requires 'Maycomb' and 'Atticus' to be capitalized?", "options": ["End marks", "Proper Noun Capitalization", "Double Negatives", "Comparative degree"], "ans": 1, "exp": "Specific names of people and places are proper nouns and must be capitalized.", "ref": "\u51fa\u5904\uff1a5. Grammar & Mechanics -> Capitalization"}, {"q": "47. The Ewells say 'I ain't got nothing'. How should this double negative be corrected on a grammar test?", "options": ["I doesn't have nothing", "I ain't got anything", "I don't have anything", "I not got nothing"], "ans": 2, "exp": "Double negatives are grammatically incorrect. Standard English requires a single negative.", "ref": "\u51fa\u5904\uff1a5. Grammar & Mechanics -> Double Negatives"}, {"q": "48. What are the standard components of a multi-paragraph essay?", "options": ["Only a body and conclusion", "Introduction, Body Paragraphs, and Conclusion", "A thesis statement and a works cited page", "Just a long summary"], "ans": 1, "exp": "A standard essay requires an intro, multiple body paragraphs, and a conclusion.", "ref": "\u51fa\u5904\uff1a6. Writing Composition -> Multi-Paragraph Essay Components"}, {"q": "49. Where does the Thesis Statement usually belong?", "options": ["At the very end of the conclusion", "At the end of the introduction paragraph", "In the middle of the first body paragraph", "It is not required"], "ans": 1, "exp": "The thesis statement anchors the essay at the end of the intro.", "ref": "\u51fa\u5904\uff1a6. Writing Composition -> Multi-Paragraph Essay Components"}, {"q": "50. What is the primary purpose of the Introduction paragraph?", "options": ["To list all evidence", "To hook the reader's attention and introduce the topic/thesis", "To summarize the whole book", "To introduce a counter-argument"], "ans": 1, "exp": "The intro sets the stage and presents the main argument.", "ref": "\u51fa\u5904\uff1a6. Writing Composition -> Multi-Paragraph Essay Components"}, {"q": "51. What is the primary purpose of the Conclusion paragraph?", "options": ["To introduce brand new evidence", "To hook the reader", "To restate the thesis in a new way and summarize main points", "To leave the essay unfinished for suspense"], "ans": 2, "exp": "Conclusions wrap up the argument without introducing new facts.", "ref": "\u51fa\u5904\uff1a6. Writing Composition -> Multi-Paragraph Essay Components"}, {"q": "52. In his closing argument, Atticus reminds the jury of their legal and moral duty. Which rhetorical appeal is this?", "options": ["Ethos", "Logos", "Pathos", "Hyperbole"], "ans": 0, "exp": "Ethos relies on ethics, credibility, and moral duty.", "ref": "\u51fa\u5904\uff1a7. Atticus\u2019 Closing Argument -> Ethos, Logos, Pathos & Rhetorical Devices"}, {"q": "53. Atticus uses medical evidence regarding Mayella's right-sided bruises and Tom's crippled left arm. Which appeal is this?", "options": ["Ethos", "Logos", "Pathos", "Personification"], "ans": 1, "exp": "Logos relies on logic, facts, and hard evidence.", "ref": "\u51fa\u5904\uff1a7. Atticus\u2019 Closing Argument -> Ethos, Logos, Pathos & Rhetorical Devices"}, {"q": "54. Atticus tries to make the jury feel pity for Mayella's sad life and sympathy for Tom. Which appeal is this?", "options": ["Ethos", "Logos", "Pathos", "Simile"], "ans": 2, "exp": "Pathos appeals directly to the audience's emotions and empathy.", "ref": "\u51fa\u5904\uff1a7. Atticus\u2019 Closing Argument -> Ethos, Logos, Pathos & Rhetorical Devices"}, {"q": "55. Which rhetorical device involves repeating grammatical structures to make a speech more persuasive (e.g., used heavily by Atticus)?", "options": ["Parallelism", "Flashback", "Allusion", "Foreshadowing"], "ans": 0, "exp": "Parallelism involves repeating phrases or sentence structures to build rhythm and impact.", "ref": "\u51fa\u5904\uff1a7. Atticus\u2019 Closing Argument -> Ethos, Logos, Pathos & Rhetorical Devices"}];
    let score = 0;

    const questionsDiv = document.getElementById('questions');

    questions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerText = q.q;
        card.appendChild(qText);

        const optionsDiv = document.createElement('div');
        
        q.options.forEach((optText, oIndex) => {
            const optBtn = document.createElement('div');
            optBtn.className = 'option';
            optBtn.innerText = optText;
            
            optBtn.onclick = function() {
                if (optionsDiv.classList.contains('disabled')) return;
                optionsDiv.classList.add('disabled');
                
                if (oIndex === q.ans) {
                    optBtn.classList.add('correct');
                    score++;
                    document.getElementById('score').innerText = score;
                } else {
                    optBtn.classList.add('wrong');
                    optionsDiv.children[q.ans].classList.add('correct');
                }
                expDiv.style.display = 'block';
            };
            optionsDiv.appendChild(optBtn);
        });
        
        card.appendChild(optionsDiv);

        const expDiv = document.createElement('div');
        expDiv.className = 'explanation';
        expDiv.innerHTML = "<strong>Explanation/解析:</strong> " + q.exp + "<br><span class='reference'>📘 " + q.ref + "</span>";
        card.appendChild(expDiv);

        questionsDiv.appendChild(card);
    });
</script>

</body>
</html>
